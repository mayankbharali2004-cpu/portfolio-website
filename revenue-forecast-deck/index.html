<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>12-Month Revenue Forecast &amp; Cash Runway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700;8..60,900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <!-- main.css is injected below with a cache-busting query so edits always
       take effect on reload — a plain <link> here gets stuck in the browser's
       HTTP cache indefinitely (see "Known issues" in CLAUDE.md). -->
  <script>
    document.write('<link rel="stylesheet" href="css/main.css?v=' + Date.now() + '">');
  </script>
</head>
<body>
  <div id="slideContainer" aria-live="polite"></div>

  <div id="liveSyncBadge" class="live-sync-badge" aria-live="polite">
    <span class="live-sync-badge__dot"></span>
    Updated from Excel
  </div>

  <nav id="navControls">
    <button id="prevBtn" class="nav-btn" aria-label="Previous slide">&#8592;</button>
    <div id="dots" class="dots"></div>
    <button id="nextBtn" class="nav-btn" aria-label="Next slide">&#8594;</button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <!-- Same cache-busting treatment for the app module itself. -->
  <script type="module">
    import('./js/main.js?v=' + Date.now());
  </script>
</body>
</html>
